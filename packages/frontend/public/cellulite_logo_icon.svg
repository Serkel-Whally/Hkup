<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="celluLiteGradient" x1="70" y1="70" x2="440" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#087BFF"/>
      <stop offset="0.52" stop-color="#28B9D2"/>
      <stop offset="1" stop-color="#63D78C"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
