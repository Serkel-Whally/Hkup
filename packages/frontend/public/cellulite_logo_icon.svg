    <circle cx="248" cy="174" r="14"/>
    <circle cx="318" cy="127" r="11"/>
    <circle cx="382" cy="184" r="10"/>
    <circle cx="350" cy="255" r="15"/>
    <circle cx="395" cy="316" r="10"/>
