  <g stroke="url(#celluLiteGradient)" stroke-width="4" stroke-linecap="round" opacity=".95">
    <path d="M126 188L185 145L248 174L318 127L382 184L350 255L395 316L329 354L268 391L196 351L116 321L154 259L126 188"/>
    <path d="M185 145L154 259L196 351"/>
