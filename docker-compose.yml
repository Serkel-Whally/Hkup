version: '3.8'
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./packages/backend
    command: npm run dev
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/whally
      - JWT_SECRET=change_this_secret
      - SEED_ADMIN_EMAIL=admin@whally.local
      - SEED_ADMIN_PASSWORD=ChangeMe123!
    depends_on:
      - mongo
    volumes:
      - ./packages/backend:/app
    working_dir: /app

volumes:
  mongo-data:
